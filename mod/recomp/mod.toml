[manifest]
id = "nomercy_arcade"
version = "0.86.0"
display_name = "Ultimate No Mercy"
short_description = "Coin-op mode: credits, attract demos, continues; 1 player = Story Mode, 2 players = Versus."
description = """
Runs WWF No Mercy like a coin-op.

Insert coins with 5 (player 1) or 6 (player 2), then press Start (controller) or 1 / 2 (keyboard). \
No main menu: one player goes straight to Story Mode's superstar select (men go for the World \
Heavyweight title, women for the Women's title); two players go straight into Versus (Exhibition, \
with all its match options). Only players who paid have working controllers; player 2 \
can join any time with a coin and Start. Lose a match and you get CONTINUE? 10..0: a coin and Start carry on \
right where you left off. If nobody continues, it's GAME OVER and back to the title.

The stage walk gets a low camera looking up at the wrestler. Knocked-down wrestlers get up \
without the slow hurt get-ups, and matches run 15% faster than the original (Arcade speed, below). \
Big Show is back on the roster, in Chris Benoit's box, with Funaki, Gangrel, Mosh, Thrasher, Droz, Mideon, the Mean Street Posse, the 1999 Undertaker, Raven, William Regal, Tiger Ali Singh, Jeff Jarrett and The Blue Meanie (WrestleMania 2000's), and Bret Hart, Jim Neidhart, Hollywood Hogan, Kevin Nash, Scott Hall, Randy Savage and Mr. Perfect (WCW/nWo Revenge's: on a REVENGE page of their own), and The Giant (WCW/nWo Revenge's: in Big Show's box, the Type arrows go on past Big Show's costumes to his), and Sting, Lex Luger, Goldberg, Rick Steiner, Scott Steiner, Booker T, Stevie Ray, Rey Mysterio, Roddy Piper and Eric Bischoff (WCW/nWo Revenge's, ports4: on the REVENGE pages).

F2 opens the operator menu, where all of these are set (and kept)."""
authors = [ "Shady Night Media" ]
game_id = "wwfnomercy"
minimum_recomp_version = "0.1.0"
dependencies = []
optional_dependencies = []
native_libraries = []

[[manifest.config_options]]
id = "game_mode"
name = "Game mode"
description = "Regular: No Mercy's own title, menus and attract, with all of the mod's enhancements. Arcade: the coin-op (credits, continues, attract with INSERT COIN, 1 player = Story Mode, 2 players = Versus). Takes effect at the next start-up (F2 > GAME SETTINGS > GAME MODE)."
type = "Enum"
options = [ "Regular", "Arcade" ]
default = "Regular"

[[manifest.config_options]]
id = "enabled"
name = "Arcade mode (old setting)"
description = "The old on/off switch for the arcade, kept for installs from before the two modes: read once, when such an install first starts with them (on = Arcade, off = Regular). Game mode is the setting now."
type = "Bool"
default = true

[[manifest.config_options]]
id = "free_play"
name = "Free play"
description = "Start without inserting coins."
type = "Bool"
default = false

[[manifest.config_options]]
id = "continue_secs"
name = "Continue timer"
description = "Seconds to insert a coin and press Start after losing."
type = "Enum"
options = [ "5", "10", "15", "20", "25", "30" ]
default = "10"

[[manifest.config_options]]
id = "attract_demos"
name = "Attract demos"
description = "Play CPU demo matches with random Superstars between title screens while nobody is playing."
type = "Bool"
default = true

[[manifest.config_options]]
id = "commentary"
name = "Commentary (JR & King)"
description = "Jim Ross and Jerry Lawler call the match: WWE '13's Attitude Era commentary (commentary.pak, next to the game)."
type = "Bool"
default = true

[[manifest.config_options]]
id = "commentary_volume"
name = "Commentary volume"
description = "How loud JR and King are."
type = "Number"
min = 0
max = 100
step = 10
default = 80

[[manifest.config_options]]
id = "commentary_talk"
name = "Commentary amount"
description = "How much they talk: Light, Normal, Heavy, or Nonstop."
type = "Enum"
options = [ "Light", "Normal", "Heavy", "Nonstop" ]
default = "Normal"

[[manifest.config_options]]
id = "commentary_splice"
name = "New spliced commentary"
description = "Now and then JR joins one of his own lead-ins to a Superstar's name, both cut from his real lines (\"What a move by\" ... \"Kurt Angle\"), matched by game and by how worked up he is."
type = "Bool"
default = true

[[manifest.config_options]]
id = "announcers"
name = "JR & King at the table"
description = "Jim Ross and Jerry Lawler seated at the announce table in every match (No Mercy's own models of them): they turn to the action, talk with their hands, flinch when the fight comes to them and stand when the table goes."
type = "Bool"
default = true

[[manifest.config_options]]
id = "fast_getup"
name = "Fast get up (Arcade)"
description = "Arcade mode: a wrestler knocked down gets up the game's quick way, never the slow hurt way -- unless someone with SPECIAL up is after him."
type = "Bool"
default = true

[[manifest.config_options]]
id = "fast_getup_regular"
name = "Fast get up (Regular)"
description = "Regular mode: as Fast get up (Arcade). Off: the game's own get-ups."
type = "Bool"
default = false

[[manifest.config_options]]
id = "regular_speed"
name = "Game speed (Regular)"
description = "Regular mode: matches run faster by the speed boost below. Off: the game's own speed. (Arcade mode's is Arcade speed.)"
type = "Bool"
default = false

[[manifest.config_options]]
id = "rumble_continue_arcade"
name = "Rumble continue (Arcade)"
description = "Arcade mode: a player eliminated from the Royal Rumble is held, and a credit and Start put him back in at full power. Off: his elimination is a lost match."
type = "Bool"
default = true

[[manifest.config_options]]
id = "rumble_continue_regular"
